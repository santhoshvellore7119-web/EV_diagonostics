[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-battery-diagnostics"
version = "1.0.0"
description = "Multi-Modal EV Battery Diagnostics & Active Resonant Cell-Rebalancing Platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Santhosh Vellore"}
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "python-multipart>=0.0.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]
sim = [
    "streamlit>=1.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backend*",
    "common*",
    "active_rebalancing*",
    "ev_cell_multimodal_sim*",
    "ml_pipeline*",
    "simulation_3d_demo*",
    "host_application*",
    "gazebo*",
    "hardware*",
    "matlab_simulink_demo*",
    "tests*"
]

[tool.pytest.ini_options]
testpaths = ["tests", "ev_cell_multimodal_sim/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
