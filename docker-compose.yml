version: '3.8'

services:
  # ============================================================================
  # 1. FastAPI Real-Time Diagnostic Backend
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ev-diagnostic-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./backend:/app/backend
      - ./active_rebalancing:/app/active_rebalancing
      - ./ml_pipeline:/app/ml_pipeline
      - ./simulation_3d_demo:/app/simulation_3d_demo
      - ./gazebo:/app/gazebo
      - ./hardware:/app/hardware
      - ./results:/app/results
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - ev-diagnostic-net

  # ============================================================================
  # 2. React Industrial Telemetry Frontend (Hot-Reload Dev Server)
  # ============================================================================
  frontend:
    image: node:20-alpine
    container_name: ev-diagnostic-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm start"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ev-diagnostic-net

networks:
  ev-diagnostic-net:
    driver: bridge
