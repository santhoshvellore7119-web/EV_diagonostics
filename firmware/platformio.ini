; PlatformIO Project Configuration for EV Battery Diagnostic System Firmware
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
src_dir = src

[env:esp32dev]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags = 
    -DCONFIG_FREERTOS_HZ=1000
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
    -O2

lib_deps =
    ; Add external FreeRTOS or communication driver libraries here if required
